[build-system]
# scikit-build-core runs CMakeLists.txt and puts the compiled ope._core next to the python files,
# pybind11 comes from pypi here -> no system install is needed, a c++20 compiler is enough
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "options-pricing-engine"
dynamic = ["version"]
description = "Options pricing library: Black-Scholes, Monte Carlo, trees and PDEs, C++ core, calibration, portfolio risk"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jad Bghiel" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy-stubs",  # scipy ships no type hints, mypy strict needs them
    "nbmake",  # runs the notebooks as tests in ci
    "ipykernel",  # the kernel vs code and nbmake run them with
    "pytest-benchmark",  # python side of the benchmarks, benchmarks/run.sh
]
plots = [
    "matplotlib>=3.8",
]
# to pull a chain (tier 6), the library reads a saved snapshot w/o them
market = [
    "ib_async>=2.1",  # ibkr, read only
    "yfinance>=0.2.40",  # fallback when the gateway is down
]

[project.scripts]
ope = "ope.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
# release even for editable installs: a debug build would make every benchmark meaningless
cmake.build-type = "Release"
wheel.packages = ["src/ope"]
# a fixed build dir -> a rebuild after a c++ change recompiles what changed and nothing else
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
# one source of truth for the version: the __version__ string in the package
provider = "scikit_build_core.metadata.regex"
input = "src/ope/__init__.py"

[tool.uv]
# uv caches the built package -> it must know that a c++ change means a rebuild
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*.hpp" },
    { file = "cpp/**/*.cpp" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
    "C4",  # comprehensions
    "NPY", # numpy deprecations
    "RUF", # ruff-specific
]
ignore = [
    # S, K, T, N(x) are the standard notation in every pricing text, we keep them
    "N803", # argument name should be lowercase
    "N806", # variable in function should be lowercase
    "N815", # mixedCase in class scope (sqrt_T)
    "N816", # mixedCase in global scope (notebooks: hS, hT)
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ope"]

[[tool.mypy.overrides]]
# yfinance ships no type hints
module = ["yfinance"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=ope --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["ope"]

[tool.coverage.report]
fail_under = 95
