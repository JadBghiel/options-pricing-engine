name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        # all extras so mypy and the tests also cover the matplotlib plots
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Notebooks
        # runs every notebook top to bottom, so a notebook that breaks after an api change fails ci
        run: uv run pytest --nbmake notebooks --no-cov

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # stays false until the CODECOV_TOKEN secret exists, so CI can pass before it is set
          fail_ci_if_error: false
