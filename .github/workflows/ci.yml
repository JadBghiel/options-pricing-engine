name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        # all extras so mypy and the tests also cover the matplotlib plots. this also compiles
        # the c++ core (scikit-build-core + cmake, release), so the tests below run on it too
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Notebooks
        # runs every notebook top to bottom, so a notebook that breaks after an api change fails ci
        run: uv run pytest --nbmake notebooks --no-cov

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # stays false until the CODECOV_TOKEN secret exists, so CI can pass before it is set
          fail_ci_if_error: false

  cpp:
    # the c++ core on its own: googletest in release, then the same tests under sanitizers.
    # a sanitizer adds checks around every memory access, every arithmetic op or every shared
    # variable, and the first problem aborts the run, so a green job means none was hit
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release -DOPE_BUILD_BENCHMARKS=ON
          - name: asan + ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DOPE_SANITIZE=address,undefined
          - name: tsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DOPE_SANITIZE=thread
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Lower address randomization for tsan
        # recent kernels randomize addresses more than tsan's memory layout allows, and tsan
        # aborts before any test w/ "unexpected memory mapping". 28 bits is the usual fix
        if: matrix.name == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build -DOPE_BUILD_TESTS=ON -DOPE_WERROR=ON ${{ matrix.flags }}

      - name: Build
        run: cmake --build build -j

      - name: GoogleTest
        run: ctest --test-dir build --output-on-failure
